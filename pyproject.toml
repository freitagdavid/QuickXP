[project]
name = "quickxp"
version = "0.0.0"
description = "Quickshell desktop shell inspired by Windows XP"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "QuickXP/services"]
addopts = "-q"
